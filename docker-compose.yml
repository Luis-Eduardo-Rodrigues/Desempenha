services:
  postgres:
    image: postgres:16-alpine
    container_name: desempenha-postgres
    env_file:
      - ./backend/.env
    entrypoint: ["/bin/sh", "/docker-entrypoint-wrapper.sh"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-entrypoint.sh:/docker-entrypoint-wrapper.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d desempenhaDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
